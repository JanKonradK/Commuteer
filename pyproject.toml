[project]
name = "commuteer"
version = "0.1.0"
description = "Reliability-aware public transport routing for Irish commuters"
readme = "README.md"
requires-python = ">=3.12"
# The collector runs on AWS Lambda using only the standard library (+ boto3,
# which the Lambda runtime provides), so there are no runtime dependencies yet.
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.35"]
# Modelling stack. Not needed by the AWS collector, which stays dependency-free.
ml = [
    "torch>=2.5",
    "mlflow>=3.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18",
    "scikit-learn>=1.5",
    "tabulate>=0.9",
]

[project.scripts]
commuteer-collect = "commuteer.collector.cli:main"
commuteer-train = "commuteer.delays.train:main"

[dependency-groups]
dev = [
    "boto3>=1.35",
    "moto[s3,ssm]>=5.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "tzdata>=2024.2",
    "boto3-stubs[s3,ssm]>=1.35",
    "pandas-stubs>=2.2",
]

# CPU-only PyTorch: the CUDA build is ~2 GB and not needed for these models.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commuteer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mlflow.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
